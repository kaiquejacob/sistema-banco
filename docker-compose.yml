services:
  db:
    image: mysql:8.0
    container_name: mysql_banco
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banco_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mysql_data: