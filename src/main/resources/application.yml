spring:
  application:
    name: sistema-de-banco
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/banco_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

viacep:
  base-url: https://viacep.com.br/ws
  connect-timeout: 2s
  read-timeout: 5s